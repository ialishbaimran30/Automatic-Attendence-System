services:
  db:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: attendance
      POSTGRES_USER: attendance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U attendance]
      interval: 5s
      retries: 20
  redis:
    image: redis:7.4.5-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - redis:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      retries: 20
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment: &backend-env
      DATABASE_URL: postgresql://attendance@db:5432/attendance
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      CELERY_BROKER_URL: redis://redis:6379/0
      PRIVATE_STORAGE: /app/private
      DEEPFACE_HOME: /app/private/weights
      CUDA_VISIBLE_DEVICES: '-1'
    volumes: &backend-volumes
      - private:/app/private
    ports: ['127.0.0.1:8000:8000']
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  worker:
    build: ./backend
    env_file: ./backend/.env
    environment: *backend-env
    volumes: *backend-volumes
    command: [celery, -A, config, worker, --loglevel=warning, --concurrency=1, --pool=solo]
    depends_on: [backend]
  beat:
    build: ./backend
    env_file: ./backend/.env
    environment: *backend-env
    volumes: *backend-volumes
    command: [celery, -A, config, beat, --loglevel=warning, --schedule=/app/private/celerybeat-schedule]
    depends_on: [backend]
  frontend:
    build: ./frontend
    ports: ['127.0.0.1:5173:5173']
    depends_on: [backend]
volumes:
  postgres:
  redis:
  private:
